version: "3.9"

services:

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    container_name: bugslayers-ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: bugslayers-mcp
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003"]
      interval: 10s
      timeout: 5s
      retries: 5

  gui:
    build:
      context: .
      dockerfile: Dockerfile.gui
    container_name: bugslayers-gui
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434/api/generate
      - MCP_URL=http://mcp:8003
    depends_on:
      ollama:
        condition: service_healthy
      mcp:
        condition: service_healthy
